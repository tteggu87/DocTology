metadata:
  status: Active
  source_of_truth: false
  last_updated: 2026-08-25
  purpose: Filesystem datasets read or written by distribution actions.
datasets:
  - dataset_key: skills.source
    source: .agents/skills
    owner: doctology
    canonical_shape: intelligence/schemas/skill_inventory.sql
    freshness: on_commit
    used_by_actions: [skills.check, skills.install]
  - dataset_key: skills.installed
    source: target skill root selected by the operator
    owner: target_environment
    canonical_shape: intelligence/schemas/skill_inventory.sql
    freshness: on_install
    used_by_actions: [skills.install]
