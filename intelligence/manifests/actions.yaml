metadata:
  status: Active
  source_of_truth: false
  last_updated: 2026-08-25
  purpose: Public distribution actions.
actions:
  - key: skills.check
    status: implemented
    description: Validate the exact three-skill source inventory.
    capability: cli.skills_check
    implementation: scripts.manage_skills:validate_source
    writes_layers: []
    touches_datasets: [skills.source]
  - key: skills.install
    status: implemented
    description: Synchronize the three complete skill trees to a target skill root.
    capability: cli.skills_install
    implementation: scripts.manage_skills:install
    writes_layers: [TargetSkillRoot]
    touches_datasets: [skills.source, skills.installed]
