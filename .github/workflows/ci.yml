name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: python scripts/manage_skills.py check
      - run: python -m unittest discover -s tests
      - name: Validate repository docs
        run: |
          git -c core.quotepath=false diff-tree --root --no-commit-id --name-only -r HEAD > /tmp/doctology-changed-files.txt
          python .agents/skills/repo-docs-intelligence-bootstrap/scripts/validate_repo_docs_intelligence.py --repo-root . --changed-files /tmp/doctology-changed-files.txt
